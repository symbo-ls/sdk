name: Pull Request Tests Workflow
# Smoke-tests on PRs. NODE_ENV is selected from the PR's target branch via
# server channels (server/packages/channels/channels.json):
#   next     → next.api.symbols.app
#   upcoming → upcoming.api.symbols.app
#   main     → staging.api.symbols.app  (closest channel to prod that's safe to mutate)
# The legacy `testing` env (→ test.api) is retired.
on:
  workflow_dispatch:
  repository_dispatch:
    types: [run_smoke_tests]
  pull_request:
    branches:
      - next
      - upcoming
      - main
    paths:
      - 'src/**'
      - 'integration-tests/**'
      - 'package.json'

# Cancel superseded runs when a PR is force-pushed.
concurrency:
  group: pr-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-tests:
    uses: ./.github/workflows/test-workflow.yaml
    with:
      node_env: ${{ github.base_ref == 'main' && 'staging' || github.base_ref }}
      suite: 'smoke'
      # ref left empty — checkout uses the PR head (correct for pull_request).
    secrets: inherit
