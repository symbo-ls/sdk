# Drop into <repo>/.github/workflows/deploy-from-release-manager.yml
#
# Triggered by release-manager after it tags a new version (v3.X.Y).
# Pins the deploy to that exact version so all repos in one release
# cycle deploy in lockstep.
#
# This workflow REPLACES (or augments) the per-repo deploy-on-push-to-main
# trigger. If you keep an existing deploy-on-push, gate it with:
#   if: !startsWith(github.event.head_commit.message, 'chore(release)')
# so chore(release) commits made by release-manager don't double-deploy.
#
# Required secrets on this repo:
#   - whatever your existing deploy.sh / deploy step needs (cloud creds,
#     Infisical machine identity, registry tokens, etc.)
#
# Inputs from release-manager:
#   - version:      the tag (e.g. "3.14.6"). Workflow checks out that tag.
#   - source_repo:  the repo whose push triggered this release. Useful for
#                   logging / metrics; doesn't change deploy behavior.

name: Deploy from release-manager

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. 3.14.6 — without the v prefix)'
        required: true
        type: string
      source_repo:
        description: 'Consumer repo whose push triggered this release'
        required: false
        type: string
        default: 'release-manager'
      target_env:
        description: 'Channel to test/deploy against (test/staging/production/...)'
        required: false
        type: string
        default: 'test'

concurrency:
  # Multiple release-manager cycles in flight: keep the newest, cancel
  # in-progress deploys. The newest tag is what should actually ship.
  group: deploy-${{ github.repository }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log dispatch source
        run: |
          echo "Deploying ${{ github.repository }} at v${{ inputs.version }}"
          echo "Triggered by release of: ${{ inputs.source_repo }}"

      - uses: actions/checkout@v4
        with:
          ref: 'v${{ inputs.version }}'
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Cache bun's install output. Keyed by the package.json content +
      # bun.lock (when present). Cross-cycle cache reuse — most cycles
      # change only a handful of files.
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            **/node_modules
          key: bun-${{ runner.os }}-${{ inputs.version }}-${{ hashFiles('**/package.json', 'bun.lock', 'package-lock.json') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ inputs.version }}-
            bun-${{ runner.os }}-

      # GH Packages auth — needed if this repo installs any @symbo-ls/*
      # private package. Falls through harmlessly if not (.npmrc still
      # gets npmjs.org auth).
      - name: Write .npmrc with dual-registry auth
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        if: env.INFISICAL_CLIENT_ID != ''
        run: |
          curl -1sLf 'https://dl.cloudsmith.io/public/infisical/infisical-cli/setup.deb.sh' | sudo -E bash
          sudo apt-get update && sudo apt-get install -y infisical
          INFISICAL_TOKEN=$(infisical login --method=universal-auth \
            --client-id="$INFISICAL_CLIENT_ID" --client-secret="$INFISICAL_CLIENT_SECRET" \
            --domain=https://km.api.symbols.app/api --plain --silent)
          NPM_TOKEN=$(infisical secrets get NPM_TOKEN_PUBLISH \
            --projectId=a95028f1-c89b-4d5e-87a2-d6badfb3ab4b --env=production \
            --domain=https://km.api.symbols.app/api --token="$INFISICAL_TOKEN" --plain)
          GH_PKG_TOKEN=$(infisical secrets get GITHUB_PACKAGES_TOKEN \
            --projectId=a95028f1-c89b-4d5e-87a2-d6badfb3ab4b --env=production \
            --domain=https://km.api.symbols.app/api --token="$INFISICAL_TOKEN" --plain 2>/dev/null || true)
          echo "::add-mask::$NPM_TOKEN"
          [ -n "$GH_PKG_TOKEN" ] && echo "::add-mask::$GH_PKG_TOKEN"
          NPMRC="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          {
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}"
            if [ -n "$GH_PKG_TOKEN" ]; then
              echo "@symbo-ls:registry=https://npm.pkg.github.com"
              echo "//npm.pkg.github.com/:_authToken=${GH_PKG_TOKEN}"
            fi
            echo "always-auth=true"
          } > "$NPMRC"

      - name: Install dependencies
        run: bun install --no-save

      # Tests run before deploy. Repos with custom test logic add a
      # scripts/test-from-release-manager.sh; everything else falls through
      # to `npm test --if-present`. Test failure stops the deploy.
      - name: Run tests
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_REPO: ${{ inputs.source_repo }}
          NODE_ENV: ${{ inputs.target_env || 'test' }}
        run: |
          if [ -x "./scripts/test-from-release-manager.sh" ]; then
            ./scripts/test-from-release-manager.sh
          else
            npm test --if-present
          fi

      # Each repo plugs in its own build + deploy here. Common shapes:
      #   - server:    docker build + push + deploy to GCP
      #   - workspace: bun run build + push to CDN
      #   - smbls/sdk: nothing (already published by release-manager)
      #
      # If no deploy script exists, log + skip (repos that publish-only
      # don't need anything here — release-manager already published them).
      - name: Build and deploy
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_REPO: ${{ inputs.source_repo }}
        run: |
          if [ -x "./scripts/deploy-from-release-manager.sh" ]; then
            ./scripts/deploy-from-release-manager.sh
          elif [ -x "./scripts/deploy.sh" ]; then
            ./scripts/deploy.sh
          else
            echo "::notice::No deploy script — publish-only repo. Tests passed against v${VERSION} from ${SOURCE_REPO}."
          fi
