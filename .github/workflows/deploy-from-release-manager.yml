# Drop into <repo>/.github/workflows/deploy-from-release-manager.yml
# (server, workspace, smbls, sdk — any repo with a cloud surface)
#
# Thin wrapper that calls release-manager's reusable deploy workflow.
# Per-repo customization happens in scripts/deploy-from-release-manager.sh.

name: Deploy from release-manager

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. 3.14.6 — without the v prefix)'
        required: true
        type: string
      source_repo:
        description: 'Consumer repo whose push triggered this release'
        required: false
        type: string
        default: 'release-manager'
      target_env:
        description: 'Channel to deploy against (test/staging/production)'
        required: false
        type: string
        default: 'test'

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: true

jobs:
  deploy:
    uses: symbo-ls/.github/.github/workflows/deploy-reusable.yml@main
    with:
      version: ${{ inputs.version }}
      source_repo: ${{ inputs.source_repo }}
      target_env: ${{ inputs.target_env }}
    secrets: inherit
