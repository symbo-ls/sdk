name: SDK Tests Workflow
on:
  workflow_call:
    inputs:
      node_env:
        required: false
        type: string
        default: 'upcoming'
        description: 'NODE_ENV passed to tests. Must match a server channel (server/packages/channels/channels.json): next, upcoming, staging, etc. Legacy `testing` is retired.'
      suite:
        required: false
        type: string
        default: 'smoke'
        description: 'Suite to run (smoke, auth, branch, collab, dataset, external, favorite-project, get-project, member, password, project, update-project, user).'
      ref:
        required: false
        type: string
        default: ''
        description: 'Git ref to check out. Empty = the triggering ref (correct for PRs). Pass `next` for scheduled / manual runs against the active branch.'

jobs:
  test:
    runs-on: namespace-profile-smbls
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: write
      packages: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
      INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
      INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
      INFISICAL_DOMAIN: ${{ secrets.INFISICAL_DOMAIN }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Infisical CLI
        run: |
          # The artifacts-cli.infisical.com host returns 403 — use APT repo directly
          curl -1sLf 'https://dl.cloudsmith.io/public/infisical/infisical-cli/setup.deb.sh' \
            | sudo -E bash
          sudo apt-get install -y infisical
          infisical --version

      - name: Authenticate Infisical (machine identity)
        run: |
          INFISICAL_TOKEN=$(infisical login \
            --method=universal-auth \
            --client-id="$INFISICAL_CLIENT_ID" \
            --client-secret="$INFISICAL_CLIENT_SECRET" \
            --domain="$INFISICAL_DOMAIN" \
            --plain --silent)
          echo "::add-mask::$INFISICAL_TOKEN"
          echo "INFISICAL_TOKEN=$INFISICAL_TOKEN" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > .npmrc
          # --frozen-lockfile fails fast if bun.lock and package.json have
          # drifted. Keeps CI deterministic; dep changes go through a
          # locally-regenerated bun.lock commit.
          bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          NODE_ENV: ${{ inputs.node_env }}

      - name: Run Tests
        env:
          MESSAGE: ${{ github.event.client_payload.repo }} ${{ github.event.client_payload.message }}
          NODE_ENV: ${{ inputs.node_env }}
        run: |
          set -o pipefail
          echo $MESSAGE
          # The npm `test:*` scripts do their own `infisical run --` wrap (so
          # local devs can `npm run test:smoke` after `infisical login` without
          # remembering the prefix). The wrap reads INFISICAL_TOKEN from env to
          # auth — exported by the previous step. NODE_ENV picks the Infisical
          # env (defaults to upcoming).
          bun run test:${{ inputs.suite }} 2>&1 | tee test-output.log

      # Extract Failure Summary / Prep Notification Message / Send Google Chat
      # Notification dropped here — GCHAT_WEBHOOK_URL existed on no inventory
      # (repo, org or environment), so the notification never sent; the two
      # upstream steps existed only to feed it (RELMAN-SECRET-REFS-SWEEP-ALL-WF-1).
